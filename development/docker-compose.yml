# Docker Compose configuration for home-ip-notifier development environment
# This file sets up the necessary services for development and testing
version: "3.8"

services:
  # Go development container with the project code mounted
  golang:
    image: harbor.windmaker.net/limani/base_golang_1_26
    volumes:
      - ..:/app # Mount the project directory into the container
      - ./.gomodcache:/root/go/pkg/mod # Persist Go module cache locally (dot-prefixed so Go package patterns like ./... never walk into it)
    working_dir: /app
    command: tail -f /dev/null # Keep container running
    networks:
      home-ip-notifier-net:
        ipv4_address: 172.17.0.10

  # RabbitMQ server for message broker testing
  rabbitmq:
    image: harbor.windmaker.net/limani/base_rabbitmq_server
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # RabbitMQ management interface port
    networks:
      home-ip-notifier-net:
        ipv4_address: 172.17.0.30

  # MailHog server (behind stunnel) for SMTP testing
  mailhog:
    image: harbor.windmaker.net/limani/base_mailhog
    ports:
      - "6465:6465" # SMTPS (stunnel) port
      - "8025:8025" # MailHog web interface port
    environment:
      STUNNEL_SERVICE: smtp-mailhog
      STUNNEL_ACCEPT: 6465
    networks:
      home-ip-notifier-net:
        ipv4_address: 172.17.0.40

  # otelcollector server for opentelemetry testing
  otelcollector:
    image: harbor.windmaker.net/limani/base_otelcol
    ports:
      - "55679:55679"
    networks:
      home-ip-notifier-net:
        ipv4_address: 172.17.0.60

# Custom network configuration for service communication
networks:
  home-ip-notifier-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.17.0.0/16 # Private subnet for service communication
